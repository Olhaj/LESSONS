<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обработка собитий в HTML и обработка формы в JS</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>

<body>
    <div class="containerForm">
        <form class="myForm">
            <div class="fieldText">
                <div class="field">
                    <label for="lastname">Фамилия</label>
                    <input type="text" id="lastname" name="lastname" placeholder="Например: Diken">
                    <p class="errorMessage"></p>
                </div>
                <div class="field">
                    <label for="name">Имя</label>
                    <input type="text" id="name" name="username" placeholder="Например: Max">
                    <p class="errorMessage"></p>
                </div>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Например: example@gmail.com">
                <p class="errorMessage"></p>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Например: Acv125:?\#&">
                <p class="errorMessage"></p>
            </div>
            <div class="field">
                <label for="date">Дата вашего рождения</label>
                <input type="date" id="date" name="userDate" required>
                <p class="errorMessage"></p>
            </div>
            <div class="checkbox">
                <input type="checkbox" name="checkbox"> <span>Подписаться на рассылку</span>
            </div>
            <div class="buttons">
                <button class="btn" type="reset">Сбросить</button>
                <button class="btn" type="submit">Отправить</button>
            </div>
            <div class="message">
                <p class="completionMessage"></p>
            </div>
        </form>
    </div>
</body>
<script src="/scripts/script.js"></script>

</html>
