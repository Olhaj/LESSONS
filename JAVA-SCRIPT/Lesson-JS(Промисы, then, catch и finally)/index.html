<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <main class="todo">
        <h1 class="todo__title">Мои задачи</h1>

        <form class="todo__form" id="todoForm">
            <input class="todo__input" id="todoInput" type="text" placeholder="Введите задачу" autocomplete="off">
            <button class="todo__add-button" type="submit">
                Добавить
            </button>
        </form>

        <ul class="todo__list" id="todoList"></ul>
    </main>
</body>
<script src="scripts/script.js"></script>

</html>
