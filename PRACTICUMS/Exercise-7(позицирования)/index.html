    <!-- Практическое задание 1
Создайте HTML-страницу с элементом блока (например, <div>).
Примените свойство position: relative; к этому блоку. Затем используйте свойства left, right, top и bottom,
чтобы переместить блок внутри своего родительского контейнера. Измените значения этих свойств так,
чтобы блок оказался в центре контейнера. -->
    <!-- <div class="box"></div> -->


    <!-- Практическое задание 2
Создайте HTML-страницу с двумя элементами блока (например, <div>).
Примените свойство position: relative; к каждому блоку. Затем используйте свойства left, right, top и
bottom, чтобы расположить каждый блок внутри своего родительского контейнера. Измените размеры

    <!-- <div class="container">
        <div class="box_1"></div>
        <div class="box_2"></div>
    </div> -->


    <!-- Практическое задание 3
Создайте HTML-страницу с элементом блока (например, <div>), который находится в контейнере(div).
Примените свойство position: relative; к этому блоку. Затем используйте свойства left, right, top и bottom,
чтобы переместить этот блок внутри контейнера. Измените значения этих свойств так, чтобы блок
оказался в центре контейнера. Не используем transform: translate(-50%, -50%). -->
    <!-- <div class="container">
        <div class="box"></div>
    </div> -->


    <!-- Практическое задание 4
Создайте HTML-страницу с двумя элементами блока (например, <div>).
Примените свойство position: relative; к каждому блоку. Затем используйте свойства left, right, top и
bottom, чтобы расположить каждый блок внутри своего родительского контейнера. Измените размеры
блоков, чтобы они имели разные ширины и высоты. После этого попробуйте использовать комбинацию
свойств для того, чтобы один блок находился относительно другого. -->

        <div class="box_2"></div>
    </div>
