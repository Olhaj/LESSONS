<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <form>
        <h2>Купить в 1 клик</h2>
        <div class="line"></div>
        <div class="form">
            <div class="username">
                <label for="name">Ф.И.О<span class="required">*</span></label>
                <input type="text" required />
            </div>
            <div class="userphone">
                <label for="phone">Телефон<span class="required">*</span></label>
                <input type="tel" min="12" required />
            </div>
            <div class="checkbox">
                <input type="checkbox" />Я согласен на
                <span>обработку персональных данных</span>
            </div>
            <button class="bnt" type="submit">ОТПРАВИТЬ</button>
        </div>
    </form>
</body>

</html>
