<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="./styles/style.css" type="text/css">
</head>

<body>
    <div class="container">
        <h2>Get started on Heroku today</h2>
        <div class="container_form">
            <form>
                <div>
                    <input type="text" name="firstName" placeholder="First name">
                </div>
                <div>
                    <input type="text" name="lastName" placeholder="Last name">
                </div>
                <div>
                    <input type="email" name="email" placeholder="Email address" required>
                </div>
                <div class="span">
                    <input type="text" name="companyName" placeholder="Company name">
                    <span>No company? Enter your email.again.</span>
                </div>
                <div>
                    <input type="select" name="countryRegion" placeholder="Country/Region">
                </div>
            </form>
        </div>
        <button class="bnt" type="submit">GET STARTED</button>
        <p class="agreement">This site is protected by reCAPTCHA and the Google <a href="">Privacy Policy</a>and <a
                href="">Terms of
                Service</a> apply.</p>
    </div>
</body>

</html>
