<!-- 
Что такое тэг?
Имя тега является ключевое слово, заключенное в угловые скобки. Тег может быть открывающим и закрывающим.
Например, <p> - открывающий тег, а </p> - закрывающий тег. Тег <p> используется для создания абзаца текста.

    Что такое атрибут?
Атрибуты - это дополнительные параметры, которые можно добавить к тегу для изменения его поведения или внешнего вида. Атрибуты обычно указываются внутри открывающего тега и имеют форму "имя=значение". Например, в теге <a href="https://www.google.com">Google</a>, "href" является атрибутом, который указывает URL-адрес ссылки.   

Чем отличается inline элемент от block?
Inline элементы занимают только ту ширину, которая необходима для их содержимого
Block элементы занимают всю доступную ширину контейнера и начинаются с новой строки. Примеры block элементов: <div>, <p>, <h1>.
